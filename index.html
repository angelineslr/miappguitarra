<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi guitarra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f7f7f8">
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#f7f7f8; --ink:#16181d; --card:#ffffff; --line:#e7e8ec; --muted:#6b7280; --soft:#f0f1f4;
  --accent:#4f46e5; --accent-soft:#eceafd; --accent-ink:#fff; --ok:#16876b; --bad:#d0342c; --warn:#a36b00;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --r:14px; --side:236px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --ink:#eceef2; --card:#171a20; --line:#272b33; --muted:#98a0ae; --soft:#1e222a;
         --accent:#8b86ff; --accent-soft:#232248; --accent-ink:#0f1115; --ok:#4cd2ae; --bad:#ff8a80; --warn:#f0b64a;
         --shadow:none; }
}
*{box-sizing:border-box}
input[type=range]{accent-color:var(--accent)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top h1{font:700 17px Inter,system-ui,sans-serif;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
header.top h1 svg{width:22px;height:22px;color:var(--accent)}
#today{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
#today .bar{width:64px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#today .bar i{display:block;height:100%;background:var(--ok);width:0;border-radius:4px}
main{max-width:860px;margin:0 auto;padding:8px 16px 24px}
main.wide{max-width:1240px}
h2{font:700 24px Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:8px 0 14px}
h3{font:650 13px Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 7px;font:600 11px Inter,system-ui,sans-serif;cursor:pointer;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
button,.btn{font:600 14.5px Inter,system-ui,sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer;transition:background .12s,border-color .12s,transform .05s}
button:hover:not(:disabled){background:var(--soft)}
button:active:not(:disabled){transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
button.big{font-size:20px;padding:20px 16px;width:100%;border-radius:14px}
input,select,textarea{font:15.5px Inter,system-ui,sans-serif;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;white-space:pre;overflow:auto}
label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 13px;border-radius:999px;font-weight:650;font-size:14px}
.chip{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;border-radius:14px;padding:6px 13px;min-width:56px}
.chip small.es{font-size:11px;font-weight:500;opacity:.7}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ok::after{content:" ✓";color:var(--ok)}
.chip.sel.ok::after{color:var(--accent-ink)}
.tabs{display:inline-flex;gap:2px;margin:0 0 14px;flex-wrap:wrap;background:var(--soft);padding:3px;border-radius:12px}
.tabs button{border:0;background:none;border-radius:9px;color:var(--muted)}
.tabs button:hover:not(:disabled){background:none;color:var(--ink)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.diagram{display:block}
.diagram .ln{stroke:var(--ink);stroke-width:1.2}
.diagram .nut{stroke:var(--ink);stroke-width:4.5}
.diagram .dot{fill:var(--accent)}
.diagram .fg{fill:var(--accent-ink);font:700 9px Inter,system-ui,sans-serif;text-anchor:middle}
.diagram .mk{fill:none;stroke:var(--ink);stroke-width:1.4}
.diagram .xm{stroke:var(--ink);stroke-width:1.6}
.diagram .bf{fill:var(--muted);font:600 10px Inter,system-ui,sans-serif;text-anchor:middle}
.detail{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.detail .nm{font:700 44px Inter,system-ui,sans-serif;letter-spacing:-.03em;line-height:1}
.stage{display:flex;gap:22px;justify-content:center;align-items:flex-end;padding:8px 0}
.stage .lbl{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.stage .nm{text-align:center;font:700 26px Inter,system-ui,sans-serif;letter-spacing:-.02em}
.beats{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.beats i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.beats i.on{background:var(--accent)}
.big-num{font:700 56px Inter,system-ui,sans-serif;letter-spacing:-.03em;text-align:center;line-height:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts button{font-size:20px;padding:16px}
.opts button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.songcard{display:flex;gap:10px;align-items:center}
.songcard .t{font-weight:650}
.songcard button.open{flex:1;text-align:left;border:0;background:none;padding:6px 0}
.songcard button.open:hover{background:none}
.vidwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden}
.vidwrap iframe,.vidwrap #ytbox{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vidshield{position:absolute;inset:0;z-index:2;cursor:pointer}
.vidmsg{padding:16px;color:#fff;font-size:14.5px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.vidmsg a{color:#c7d2fe}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ctrl .tm{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted)}
.nowp{display:flex;gap:16px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0;box-shadow:var(--shadow)}
.nowp .c{text-align:center;min-width:100px}
.nowp .c .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.nowp .c .nm{font:700 20px Inter,system-ui,sans-serif}
.sync{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:14px;margin:10px 0}
.song{font-size:17px}
.song .cl{margin:2px 0 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:0;padding:2px 6px;border-radius:10px;transition:background .15s}
.song .seg{display:inline-flex;flex-direction:column;vertical-align:bottom}
.song .tx{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:1.3em}
.song .ch{align-self:flex-start;font:700 14.5px ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:none;border:0;border-radius:6px;padding:1px 4px;text-align:left;cursor:pointer;min-height:1.5em}
.song .ch:hover{background:var(--accent-soft)}
.song .ch.ph{visibility:hidden}
.song .ch.on{background:var(--accent);color:var(--accent-ink)}
.song .ch.ptr{outline:2px dashed var(--accent);outline-offset:1px}
.song .ch.has{text-decoration:underline dotted var(--muted)}
.song.hide .ch:not(.rev){color:transparent;background:var(--line)}
.song .lbl{font-weight:700;color:var(--muted);margin-right:8px;align-self:flex-end;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.song .lp{border:0;background:none;color:var(--muted);padding:0 6px 0 0;font-size:15px;align-self:flex-end}
.song .curline{background:var(--accent-soft)}
.song pre.tab{font:13px ui-monospace,Menlo,Consolas,monospace;overflow:auto;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.song .cl.nolyr .tx{display:none}
.song .blank{height:10px}
.song .ltxt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;white-space:pre-wrap}
.songlay{display:block}
.songl .vidwrap{box-shadow:var(--shadow)}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:10px}
.bars div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px;position:relative}
.bars div.z{background:var(--line)}
.barlbl{display:flex;gap:5px;font-size:10px;color:var(--muted)}
.barlbl span{flex:1;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;box-shadow:var(--shadow);color:var(--muted);font-size:13px}
.stat b{display:block;font:700 28px Inter,system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.note{background:color-mix(in srgb,var(--warn) 12%,transparent);border-left:3px solid var(--warn);padding:8px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.pat{display:flex;gap:4px;justify-content:center;margin:10px 0;flex-wrap:nowrap}
.pat .pc{flex:1 1 0;max-width:46px;min-width:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px;background:var(--card)}
.pat .pc small{display:block;color:var(--muted);font-size:11px}
.pat .pc b{font-size:22px;line-height:1.2}
.patset .pat+.pat{margin-top:4px}
.pat .pc.acc{border:2px solid var(--accent);background:var(--accent-soft)}
.pat .pc.acc.on{background:var(--accent)}
.pat.big{gap:6px}
.pat.big .pc{max-width:78px;padding:8px 2px 6px}
.pat.big .pc b{font-size:36px;line-height:1.1;display:block}
.pat .pc .syl{display:block;font-size:13px;font-weight:650;min-height:18px;color:var(--muted)}
.pat .pc.on .syl{color:var(--accent-ink)}
.pat .pc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pat .pc.on small{color:var(--accent-ink)}
.pat button.pcell{flex:1 1 0;min-width:0;max-width:52px;height:52px;font-size:22px;padding:0}
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.seq span{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-weight:650;background:var(--card)}
.seq span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pattxt{font-size:20px;letter-spacing:4px}
.seek{width:100%;margin:2px 0}
.nudge{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* pentagrama y tablatura */
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px 6px;box-shadow:var(--shadow);max-height:68vh;overflow:auto;position:relative}
.srow{position:relative;margin:0 0 6px;overflow:hidden}
.shdr{display:flex}
.sc{text-align:center;cursor:pointer;border-radius:8px;padding-top:2px}
.sc .scn{font:700 17px Inter,system-ui,sans-serif;letter-spacing:-.01em}
.sc .sct{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.sc .diagram{margin:0 auto}
.sc.cur .scn{color:var(--accent)}
.sc.done{opacity:.55}
.sc.sel,.sc.cur{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.ssvg{display:block}
.ssvg .sl{stroke:var(--muted);stroke-width:.8;opacity:.75}
.ssvg .bar{stroke:var(--muted);stroke-width:1}
.ssvg .led{stroke:var(--ink);stroke-width:1}
.ssvg .nh{fill:var(--ink)}
.ssvg .stem{stroke:var(--ink);stroke-width:1.1}
.ssvg .acc{fill:var(--ink);font:11px system-ui,sans-serif}
.ssvg .fn{fill:var(--ink);font:600 10.5px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px}
.ssvg .tabl{fill:var(--muted);font:700 11px Inter,system-ui,sans-serif;text-anchor:middle}
.ssvg .clef{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ssvg .cbg{fill:transparent;cursor:pointer}
.ssvg .cg.sel .cbg,.ssvg .cg.cur .cbg{fill:color-mix(in srgb,var(--accent) 13%,transparent)}
.ssvg .cg.cur .nh,.ssvg .cg.cur .fn,.ssvg .cg.cur .acc{fill:var(--accent)}
.ssvg .cg.cur .stem{stroke:var(--accent)}
.ssvg .cg.done{opacity:.55}
.scur{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);opacity:.85;pointer-events:none;transition:left .1s linear;z-index:2;border-radius:2px}
.scorebar{display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.wideonly{display:none}
.scorebar select{padding:6px 8px;font-size:13.5px}
.ed .edgrid{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.ed .pm{display:inline-flex;gap:6px}
.ed .pm button{min-width:42px}
.song .ch.done{color:var(--muted)}
.song .ch.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px var(--accent)}
/* ordenador: barra lateral */
@media (min-width:900px){
  body{padding-bottom:0}
  header.top{position:fixed;left:0;top:0;width:var(--side);height:116px;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;padding:20px 22px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  header.top h1{font-size:19px}
  #today{width:100%}
  #today .bar{flex:1}
  nav.bottom{left:0;right:auto;top:116px;bottom:0;width:var(--side);flex-direction:column;justify-content:flex-start;gap:2px;padding:6px 12px;background:none;border-top:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  nav.bottom button{flex:none;flex-direction:row;gap:12px;justify-content:flex-start;padding:10px 12px;font-size:14.5px;border-radius:10px}
  nav.bottom button:hover{background:var(--soft)}
  nav.bottom button.on{background:var(--accent-soft);color:var(--accent)}
  main{margin-left:var(--side);margin-right:0;max-width:none;padding:28px 40px 48px}
  main > *{max-width:880px}
  main.wide > *{max-width:none}
  #toast{bottom:28px}
  .songlay{display:grid;grid-template-columns:minmax(380px,5fr) minmax(460px,6fr);gap:28px;align-items:start}
  .songl{min-width:0}
  .songr{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding:2px;min-width:0;scrollbar-gutter:stable}
  .songr .scorebox{max-height:none;overflow:visible}
  .wideonly{display:flex}
  .songl .nowp{display:none}
  .song{font-size:18px}
}
@media (min-width:1500px){ main > *{max-width:960px} }
</style>

</head>
<body>
<header class="top">
  <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 9.5 20 4"/><path d="M18 3l3 3"/><path d="M11 8c1.5-1.5 4-1 5 .5.8 1.2 2.4 1.2 2.4 2.7 0 1.8-1.4 2.8-3 3.3-1 .3-1.6 1-1.9 2-.5 1.7-1.7 3-3.9 3C6.700 19.500 4 17.600 4 14.900c0-2.200 1.400-3.200 2.800-3.700 1-.4 1.800-.9 2.200-1.900.3-.7.800-1.100 2-1.300z"/><circle cx="10.500" cy="14.500" r="1"/></svg>Mi guitarra</h1>
  <div id="today"></div>
</header>
<main id="view"></main>
<nav class="bottom" id="nav"></nav>
<div id="toast"></div>
<datalist id="chordlist"></datalist>

<script>
(function(){
'use strict';

/* ============================== utilidades ============================== */
const $ = (s, e=document) => e.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k === 'text') el.textContent = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if(k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for(const c of kids.flat(Infinity)){
    if(c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
function add(parent, ...kids){
  for(const c of kids.flat(Infinity)){ if(c == null || c === false) continue; parent.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return parent;
}
const NS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids){
  const el = document.createElementNS(NS, tag);
  for(const k in attrs||{}) el.setAttribute(k, attrs[k]);
  for(const c of kids.flat()) if(c != null) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtMin = sec => sec < 60 ? Math.round(sec)+' s' : (sec < 3600 ? Math.round(sec/60)+' min' : (sec/3600).toFixed(1).replace('.',',')+' h');
const fmtTime = t => { t = Math.max(0, t||0); return Math.floor(t/60)+':'+pad(Math.floor(t%60)); };
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2400); }

/* ============================== almacenamiento ============================== */
const KEY = 'guitarra-app-v1';
function defaultDb(){ return { songs:[], mastered:{}, days:{}, pairs:{}, quiz:{correct:0,total:0,miss:{}}, songStats:{}, goalMin:10, seeded:false, rhythms:[], rhythmStats:{}, progs:{}, ui:{ split:55, perRow:0 } }; }
function loadDb(){
  try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(defaultDb(), JSON.parse(r)); }catch(e){}
  return defaultDb();
}
let db = loadDb();
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(flush, 400); }
function flush(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flush(); });

/* ============================== teoría: acordes ============================== */
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_IDX = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const OPEN_MIDI = [40,45,50,55,59,64]; // E2 A2 D3 G3 B3 E4

function parseRoot(str){
  const m = /^([A-G])([#b]?)/.exec(str);

function voicing(root, q){
  const key = SHARPS[root] + q;
  if(OPEN[key]) return { frets:OPEN[key][0].slice(), fingers:OPEN[key][1].slice(), barre:null };

  const start = useE ? 0 : 1;
  const frets = tpl.map(x => x < 0 ? -1 : x + b);
  const fingers = tpl.map(()=>0);
  const notes = [];
  tpl.forEach((x,i)=>{ if(x > 0) notes.push({i, f:x}); });
  notes.sort((p,q2)=> p.f - q2.f || p.i - q2.i);

  notes.forEach(n => { fingers[n.i] = Math.min(4, fg++); });

}
function notesOf(frets){
  const out = [];
  frets.forEach((f,i)=>{ if(f >= 0){ const n = SHARPS[(OPEN_MIDI[i]+f)%12]; if(!out.includes(n)) out.push(n); } });

}
const infoCache = {};

    r = { name, root:p.root, q:ql.q, approx:ql.approx, key:SHARPS[p.root]+ql.q, v:voicing(p.root, ql.q), bass:p.bass };
    r.notes = notesOf(r.v.frets);

}
function transposeName(name, n){
  if(!n) return name;
  const m = /^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/.exec(name);
  if(!m) return name;

  if(m[3]){ const b = parseRoot(m[3]); out += '/' + (b.flat ? FLATS : SHARPS)[(b.semi + n + 120) % 12]; }

/* diagrama SVG */
function diagram(name, w){
  const info = chordInfo(name);
  const svg = s('svg', { viewBox:'0 0 120 150', width:w||110, class:'diagram', role:'img', 'aria-label':'Diagrama de '+name });
  if(!info){ svg.append(s('text', {x:60,y:80,class:'bf'}, '?')); return svg; }
  const { frets, fingers, barre } = info.v;
  const fretted = frets.filter(f => f > 0);
  const maxF = fretted.length ? Math.max(...fretted) : 0;
  const minF = fretted.length ? Math.min(...fretted) : 1;
  const base = maxF > 5 ? minF : 1;
  const x0 = 24, dx = 14.4, y0 = 34, dy = 20;
  const X = i => x0 + i*dx;
  for(let r = 0; r <= 5; r++){
    if(r === 0 && base === 1) svg.append(s('line', {x1:X(0), y1:y0, x2:X(5), y2:y0, class:'nut'}));
    else svg.append(s('line', {x1:X(0), y1:y0+r*dy, x2:X(5), y2:y0+r*dy, class:'ln'}));
  }
  for(let i = 0; i < 6; i++) svg.append(s('line', {x1:X(i), y1:y0, x2:X(i), y2:y0+5*dy, class:'ln'}));
  if(base > 1) svg.append(s('text', {x:9, y:y0+dy*0.5+4, class:'bf'}, base+'ª'));
  frets.forEach((f,i)=>{
    if(f === -1){
      svg.append(s('line', {x1:X(i)-4,y1:y0-14,x2:X(i)+4,y2:y0-6,class:'xm'}));
      svg.append(s('line', {x1:X(i)+4,y1:y0-14,x2:X(i)-4,y2:y0-6,class:'xm'}));
    } else if(f === 0){
      svg.append(s('circle', {cx:X(i), cy:y0-10, r:4, class:'mk'}));
    }
  });
  if(barre){
    const row = barre.fret - base, cy = y0 + row*dy + dy/2;
    svg.append(s('rect', {x:X(barre.from)-6.5, y:cy-6.5, width:X(barre.to)-X(barre.from)+13, height:13, rx:6.5, class:'dot'}));
    svg.append(s('text', {x:X(barre.from), y:cy+3.2, class:'fg'}, '1'));
  }
  frets.forEach((f,i)=>{
    if(f <= 0) return;
    if(barre && f === barre.fret && i >= barre.from) return;
    const cy = y0 + (f-base)*dy + dy/2;
    svg.append(s('circle', {cx:X(i), cy, r:6.4, class:'dot'}));
    if(fingers[i]) svg.append(s('text', {x:X(i), y:cy+3.2, class:'fg'}, fingers[i]));
  });
  return svg;
}

let AC = null, master = null;
function ac(){
  if(!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    master = AC.createGain(); master.gain.value = 0.7;
    master.connect(comp); comp.connect(AC.destination);
  }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
const plCache = new Map();
function pluckBuf(freq, dur){
  const c = ac(), sr = c.sampleRate, key = freq.toFixed(2) + '|' + dur + '|' + sr;
  let b = plCache.get(key); if(b) return b;
  const n = Math.floor(sr*dur);
  b = c.createBuffer(1, n, sr);
  const d = b.getChannelData(0);
  const N = Math.max(2, Math.round(sr/freq)), line = new Float32Array(N);
  for(let i = 0; i < N; i++) line[i] = Math.random()*2 - 1;
  let idx = 0;
  for(let i = 0; i < n; i++){
    const a = line[idx], b2 = line[(idx+1) % N];
    d[i] = a;
    line[idx] = (a + b2) * 0.5 * 0.9965;
    idx = (idx+1) % N;
  }
  plCache.set(key, b);
  return b;
}
function pluck(freq, when, dur, vol){
  const c = ac();
  const src = c.createBufferSource(); src.buffer = pluckBuf(freq, dur);
  const g = c.createGain();
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(g); g.connect(master);
  src.start(when);
}
/* grabaciones reales: carpeta sounds/ con un mp3 por acorde (A.mp3, Am.mp3, Cs.mp3 para C#…) y sounds/lista.json con los nombres */
const SAMPLES = { list:null, buf:{}, loading:{} };
(typeof fetch === 'function' ? fetch('sounds/lista.json') : Promise.reject()).then(r => r.ok ? r.json() : []).then(l => { SAMPLES.list = new Set(l); }).catch(() => { SAMPLES.list = new Set(); });
function sampleKey(info){ return info.bass == null ? info.key.replace(/#/g, 's') : null; }
function loadSample(k){
  if(SAMPLES.buf[k]) return Promise.resolve(SAMPLES.buf[k]);
  if(SAMPLES.loading[k]) return SAMPLES.loading[k];
  return SAMPLES.loading[k] = fetch('sounds/'+k+'.mp3').then(r => r.arrayBuffer()).then(ab => new Promise((ok, ko) => ac().decodeAudioData(ab, ok, ko)))
    .then(b => (SAMPLES.buf[k] = b)).catch(() => { if(SAMPLES.list) SAMPLES.list.delete(k); return null; });
}
function playSample(buf, vol){ const c = ac(), src = c.createBufferSource(), g = c.createGain(); src.buffer = buf; g.gain.value = vol || 0.9; src.connect(g); g.connect(c.destination); src.start(c.currentTime + 0.01); }
function playChord(name, mode){
  const info = chordInfo(name); if(!info) return;
  if(mode !== 'arp' && SAMPLES.list){ const k = sampleKey(info);
    if(k && SAMPLES.list.has(k)){ loadSample(k).then(b => { if(b) playSample(b); else playChordSynth(info, mode); }); return; } }
  playChordSynth(info, mode);
}
function playChordSynth(info, mode){
  try{
    const c = ac(); const t0 = c.currentTime + 0.02;
    const idxs = [];
    info.v.frets.forEach((f,i)=>{ if(f >= 0) idxs.push(i); });
    const arp = mode === 'arp';
    idxs.forEach((i,k)=>{
      const freq = 440 * Math.pow(2, (OPEN_MIDI[i] + info.v.frets[i] - 69)/12);
      pluck(freq, t0 + k*(arp ? 0.28 : 0.03), arp ? 1.6 : 2.0, 0.22);
    });
  }catch(e){}
}
function click(t, accent){
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.frequency.value = accent ? 1600 : 1100;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.08);
}
function createMetro(onBeat){
  let timer = null, nextT = 0, beat = 0, bpm = 60;
  function sched(){
    const c = ac();
    while(nextT < c.currentTime + 0.15){
      const b = beat, when = nextT;
      click(when, b % 4 === 0);
      setTimeout(()=>onBeat(b), Math.max(0, (when - c.currentTime) * 1000));
      nextT += 60 / bpm; beat++;
    }
  }
  return {
    start(newBpm){ bpm = newBpm; const c = ac(); nextT = c.currentTime + 0.1; beat = 0; sched(); timer = setInterval(sched, 25); },
    setBpm(v){ bpm = v; },
    stop(){ clearInterval(timer); timer = null; }
  };
}

let lastAct = Date.now();
['pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, ()=>{ lastAct = Date.now(); }, {passive:true}));
const busy = { drill:false, yt:false, prog:false, rhythm:false };

  const k = dayKey();

  d.sec++;

    const st = db.songStats[play.song.id] || (db.songStats[play.song.id] = { sec:0, rateSec:{}, loops:0, status:'aprendiendo' });

  }

    rs.sec = (rs.sec || 0) + 1;

function todaySec(){ return (db.days[dayKey()] || {sec:0}).sec; }
function renderToday(){
  const el = $('#today'); if(!el) return;
  const goal = db.goalMin * 60, pct = Math.min(100, Math.round(todaySec() / goal * 100));
  el.replaceChildren(h('span', {text:'Hoy '+Math.floor(todaySec()/60)+'/'+db.goalMin+' min'}), h('div', {class:'bar'}, h('i', {style:'width:'+pct+'%'})));
}
function streak(){
  const d = new Date();
  const ok = k => db.days[k] && db.days[k].sec >= 60;
  if(!ok(dayKey(d))) d.setDate(d.getDate()-1);
  let n = 0;
  while(ok(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function bestStreak(){
  const keys = Object.keys(db.days).filter(k => db.days[k].sec >= 60).sort();
  let best = 0, run = 0, prev = null;
  keys.forEach(k => {
    const [y,m,dd] = k.split('-').map(Number);
    const t = Date.UTC(y, m-1, dd);
    run = (prev !== null && t - prev === 86400000) ? run + 1 : 1;
    prev = t; best = Math.max(best, run);
  });
  return best;
}

/* ============================== analizador de canciones ============================== */
const CHORD_TOKEN = /^[A-G][#b]?(?:maj|min|dim|aug|sus|add|m|M|-|\+)?\d*(?:(?:sus|add)\d*|[#b]\d+|\([^)]*\))*(?:\/[A-G][#b]?)?$/;
const ES2EN = {DO:'C', RE:'D', MI:'E', FA:'F', SOL:'G', LA:'A', SI:'B'};
const EN2ES = {C:'DO', D:'RE', E:'MI', F:'FA', G:'SOL', A:'LA', B:'SI'};
/* notación española (solo en mayúsculas, para no confundir con palabras de la letra): DO, REm, SOL7, FA#m, SIb… */
function spToEn(tok){
  const m = /^(DO|RE|MI|FA|SOL|LA|SI)([#b]?)(.*)$/.exec(tok); if(!m) return null;
  let rest = m[3];
  const sl = rest.indexOf('/');
  if(sl >= 0){ const b = /^(DO|RE|MI|FA|SOL|LA|SI)([#b]?)$/.exec(rest.slice(sl+1)); if(b) rest = rest.slice(0, sl) + '/' + ES2EN[b[1]] + b[2]; }
  return ES2EN[m[1]] + m[2] + rest;
}
const ES_NAME = {C:'Do', D:'Re', E:'Mi', F:'Fa', G:'Sol', A:'La', B:'Si'};
/* nombre en notación española en minúsculas/mayúscula inicial: A → La, F#m → Fa#m, G/B → Sol/Si */
const esName = n => String(n).replace(/^([A-G])/, (x, l) => ES_NAME[l]).replace(/\/([A-G])/, (x, l) => '/' + ES_NAME[l]);
const bothName = n => { const e = esName(n); return e === n ? n : n + ' ('+e+')'; };
/* acepta tanto "Am" como "La m", "Lam", "Sol7", "Fa#m"… y devuelve el nombre americano si es un acorde válido */
function normChord(v){
  v = String(v || '').trim(); if(!v) return v;
  if(chordInfo(v)) return v;
  const m = /^(do|re|mi|fa|sol|la|si)\s*([#b]?)\s*(.*)$/i.exec(v);
  if(m){
    let rest = m[3], sl = rest.indexOf('/');
    if(sl >= 0){ const b = /^(do|re|mi|fa|sol|la|si)([#b]?)$/i.exec(rest.slice(sl+1)); if(b) rest = rest.slice(0, sl) + '/' + ES2EN[b[1].toUpperCase()] + b[2]; }
    const c = ES2EN[m[1].toUpperCase()] + m[2] + rest;
    if(chordInfo(c)) return c;
  }
  return v;
}
function toES(name){
  return String(name).replace(/^([A-G])/, (x, l) => EN2ES[l]).replace(/\/([A-G])/, (x, l) => '/' + EN2ES[l]);
}
const FILLERS = new Set(['|','o','O','x2','x3','x4','-','/','N.C.','NC','...','%']);
function chordLine(L){
  let line = L;

  const lm = /^(\s*)([A-Za-zÁÉÍÓÚáéíóúñÑ ]{2,24}):(?=\s|$)/.exec(L);
  if(lm){ label = lm[2].trim(); line = ' '.repeat(lm[0].length) + L.slice(lm[0].length); }
  const re = /\S+/g; let m; const items = [];
  while((m = re.exec(line))){
    let tok = m[0].replace(/^[(\[]+|[)\],;.]+$/g, '');
    if(tok === '' || FILLERS.has(tok) || /^\(?x\d\)?$/i.test(tok)) continue;
    const en = spToEn(tok), nm = en || tok;
    if(CHORD_TOKEN.test(nm)) items.push({ name:nm, es:!!en, col:m.index + (m[0].length - m[0].replace(/^[(\[]+/, '').length) });
    else return null;
  }
  return items.length ? { label, items } : null;
}
function isTabLine(L){ return /^\s*[eBGDAE]\s*[|:\-]/.test(L) && (L.match(/-/g)||[]).length >= 4; }
function parseSong(raw){
  const lines = String(raw||'').replace(/\r/g,'').split('\n');
  const out = []; let n = 0, es = false;
  for(let i = 0; i < lines.length; i++){
    const L = lines[i];
    if(!L.trim()){ out.push({t:'blank'}); continue; }
    if(isTabLine(L)){
      const blk = [L];
      while(i+1 < lines.length && isTabLine(lines[i+1])) blk.push(lines[++i]);
      out.push({t:'tab', lines:blk}); continue;
    }
    const ch = chordLine(L);
    if(ch){
      let lyric = '';
      const nx = lines[i+1];
      if(nx !== undefined && nx.trim() && !chordLine(nx) && !isTabLine(nx)){ lyric = nx; i++; }
      if(ch.items.some(it => it.es)) es = true;
      out.push({ t:'cl', label:ch.label, lyric, chords:ch.items.map(it => ({ name:it.name, col:it.col, idx:n++ })) });
      continue;
    }
    out.push({t:'text', text:L});

}
function ytId(url){
  if(!url) return null;
  const m = /(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/.exec(url.trim());

function stageNodes(cur, next){
  return [
    h('div', {}, h('div',{class:'lbl',text:'Ahora'}), diagram(cur, 130), h('div',{class:'nm',text:bothName(cur)})),
    h('div', {}, h('div',{class:'lbl',text:'Siguiente'}), diagram(next, 90), h('div',{class:'nm',text:bothName(next)}))

function renderCambios(box){
  const stage = h('div', {class:'stage', id:'dstage'});
  const beatsEl = h('div', {class:'beats', id:'dbeats'}, [0,1,2,3].map(()=>h('i')));
  const info = h('div', {class:'muted small', id:'dinfo', style:'text-align:center'});
  const startBtn = h('button', {class:'primary', id:'dstart'}, '▶ Empezar');
  const bpmLbl = h('b', {text:pr.bpm+' BPM'});
  const bpm = h('input', {type:'range', min:'40', max:'140', step:'2', value:String(pr.bpm), 'aria-label':'Tempo'});
  bpm.addEventListener('input', ()=>{ pr.bpm = +bpm.value; bpmLbl.textContent = pr.bpm+' BPM'; if(drill) drill.metro.setBpm(pr.bpm); });
  const beats = h('select', {'aria-label':'Pulsos por acorde'}, [2,4,8].map(n => h('option', {value:n, selected:n===pr.beats}, n+' pulsos por acorde')));
  beats.addEventListener('change', ()=>{ pr.beats = +beats.value; });
  startBtn.addEventListener('click', ()=>{ drill ? stopDrill(true) : startDrill(); });
  box.append(
    h('div', {class:'card'},
      h('p', {class:'muted', style:'margin-top:0', text:'Toca el primer acorde y cámbialo al siguiente justo antes de que acabe el compás. Empieza lento y sube el tempo cuando salga limpio.'}),
      pairInputs(()=>{ stopDrill(); render(); }),
      h('div', {class:'row', style:'margin-top:10px'}, bpm, bpmLbl, beats)),
    h('div', {class:'card'}, stage, beatsEl, info, h('div', {class:'row', style:'justify-content:center;margin-top:8px'}, startBtn))
  );
  stage.replaceChildren(...stageNodes(pr.a, pr.b));
  const pk = pairKey(), best = pk && db.pairs[pk];
  info.textContent = best && best.maxBpm ? 'Tu tempo más alto con este par: '+best.maxBpm+' BPM' : '';
}
function startDrill(){
  if(drill) return;
  const toggle = [pr.a, pr.b];
  drill = { cur:0, changes:0, startBpm:pr.bpm, metro:null };
  drill.metro = createMetro(beat => {
    if(!drill) return;
    const bi = beat % pr.beats;
    const dots = $('#dbeats'); if(dots) [...dots.children].forEach((d,i)=>d.classList.toggle('on', i === Math.min(bi,3)));
    if(beat > 0 && bi === 0){
      drill.cur = 1 - drill.cur; drill.changes++;
      const stage = $('#dstage');
      if(stage) stage.replaceChildren(...stageNodes(toggle[drill.cur], toggle[1-drill.cur]));
      const info = $('#dinfo'); if(info) info.textContent = 'Cambios hechos: '+drill.changes;
    }
  });
  busy.drill = true;
  drill.metro.start(pr.bpm);
  const b = $('#dstart'); if(b) b.textContent = '■ Parar';
}
function stopDrill(){
  if(!drill) return;
  drill.metro.stop();
  const pk = pairKey();
  if(pk && drill.changes >= 12){
    const p = db.pairs[pk] || (db.pairs[pk] = {});
    p.maxBpm = Math.max(p.maxBpm || 0, pr.bpm); save();
  }
  drill = null; busy.drill = false;
  const b = $('#dstart'); if(b) b.textContent = '▶ Empezar';
  const dots = $('#dbeats'); if(dots) [...dots.children].forEach(d=>d.classList.remove('on'));
}

/* --- test de acordes --- */
function stopQuiz(){ if(quiz && quiz.t) clearTimeout(quiz.t); quiz = null; }
function renderTest(box){
  quiz = { session:{c:0,n:0}, q:null, t:null, locked:false };
  const area = h('div', {id:'qarea'});
  box.append(h('div', {class:'card'}, h('p', {class:'muted', style:'margin-top:0', text:'Mira el diagrama y elige qué acorde es. Los que más fallas salen más a menudo.'}), area));
  nextQuestion();
}
function nextQuestion(){
  if(!quiz) return;
  const pool = allKnownNames();
  const weighted = [];
  pool.forEach(n => { const k = chordInfo(n).key; const w = 1 + 2*(db.quiz.miss[k] || 0); for(let i = 0; i < Math.min(w,7); i++) weighted.push(n); });
  const correct = weighted[Math.floor(Math.random()*weighted.length)];
  const ck = chordInfo(correct).key;
  const others = pool.filter(n => chordInfo(n).key !== ck).sort(()=>Math.random()-0.5).slice(0,3);
  const options = [correct, ...others].sort(()=>Math.random()-0.5);
  quiz.q = { correct, options }; quiz.locked = false;
  const area = $('#qarea'); if(!area) return;
  area.replaceChildren(
    h('div', {class:'row', style:'justify-content:center'}, diagram(correct, 150)),
    h('div', {class:'opts'}, options.map(o => h('button', {onclick:ev => answer(o, ev.currentTarget)}, o))),
    h('div', {class:'muted small', style:'text-align:center;margin-top:10px', text:'Esta sesión: '+quiz.session.c+' de '+quiz.session.n})
  );
}
function answer(o, btn){
  if(!quiz || quiz.locked) return;
  quiz.locked = true;
  const q = quiz.q, ok = chordInfo(o).key === chordInfo(q.correct).key;
  quiz.session.n++; db.quiz.total++;
  const ck = chordInfo(q.correct).key;
  if(ok){ quiz.session.c++; db.quiz.correct++; if(db.quiz.miss[ck] > 0) db.quiz.miss[ck]--; }
  else db.quiz.miss[ck] = (db.quiz.miss[ck] || 0) + 1;
  save();
  btn.classList.add(ok ? 'right' : 'wrong');
  if(!ok) [...$('#qarea').querySelectorAll('.opts button')].forEach(b => { if(chordInfo(b.textContent).key === ck) b.classList.add('right'); });
  playChord(q.correct, 'strum');
  quiz.t = setTimeout(nextQuestion, ok ? 900 : 1800);
}

    rows[rows.length-1].append(h('div', {class:'pc'+(acc.includes(i) ? ' acc' : '')}, h('small', {text:labels[i] || ''}), h('b', {text:symOf(tk)}), syl ? h('span', {class:'syl', text:syl[i] || ''}) : null));
  });
  return h('div', {class:'patset'}, rows);
}
function setPat(el, pos){ if(el) [...el.querySelectorAll('.pc')].forEach((c,i) => c.classList.toggle('on', i === pos)); }
function later(when, fn){ setTimeout(fn, Math.max(0, (when - ac().currentTime) * 1000)); }

function strumAt(name, tok, when, acc){
  const info = chordInfo(name); if(!info) return;
  const g = acc ? 1.7 : 1;
  const fr = info.v.frets, snd = [];
  fr.forEach((f,i) => { if(f >= 0) snd.push(i); });
  if(!snd.length) return;
  const freq = i => 440 * Math.pow(2, (OPEN_MIDI[i] + fr[i] - 69) / 12);
  if(tok === 'D') snd.forEach((i,k) => pluck(freq(i), when + k*0.012, 1.4, 0.2*g));
  else if(tok === 'U') snd.filter(i => i >= 2).reverse().forEach((i,k) => pluck(freq(i), when + k*0.010, 1.0, 0.14*g));
  else if(tok === 'M') snd.forEach((i,k) => pluck(freq(i), when + k*0.006, 0.12, 0.12*g));
  else if(tok === 'B') pluck(freq(snd[0]), when, 1.6, 0.28*g);
  else if(/^[1-6]$/.test(tok)){ const i = 6 - (+tok); if(fr[i] >= 0) pluck(freq(i), when, 1.4, 0.22*g); }
}
function createStepper(bpm, onStep, sub){
  sub = sub || 2;
  let timer = null, nextT = 0, idx = 0, cur = bpm;
  function sched(){
    const c = ac();
    while(nextT < c.currentTime + 0.15){ onStep(idx, nextT); nextT += 60 / cur / sub; idx++; }
  }
  return {
    start(){ nextT = ac().currentTime + 0.1; idx = 0; sched(); timer = setInterval(sched, 25); },
    setBpm(v){ cur = v; },
    stop(){ clearInterval(timer); timer = null; }
  };
}
let eng = null;
function stopEngine(){
  if(!eng) return;
  const e = eng; eng = null;
  e.stepper.stop(); busy.prog = false; busy.rhythm = false;
  if(e.onStop) e.onStop(e);
}
function toggleBtn(label, get, set){
  const b = h('button', {class:get() ? 'primary' : ''}, label);
  b.addEventListener('click', () => { set(!get()); b.classList.toggle('primary', get()); });
  return b;
}
function mountVideo(wrap, vid, getRate){
  const o = { player:null, ready:false, playing:false, dead:false };
  wrap.append(h('div', {id:'rvbox'}));
  const msg = txt => wrap.replaceChildren(h('div', {class:'vidmsg'}, h('div', {}, txt, ' ', h('a', {href:'https://www.youtube.com/watch?v='+vid, target:'_blank', rel:'noopener'}, 'Abrir en YouTube'))));
  loadYT(() => {
    if(o.dead) return;
    const opts = { videoId:vid, playerVars:{ playsinline:1, rel:0 }, events:{
      onReady: () => { o.ready = true; },
      onStateChange: e => { o.playing = e.data === 1; busy.yt = o.playing; if(e.data === 1 && getRate){ try{ o.player.setPlaybackRate(getRate()); }catch(err){} } },
      onError: e => {
        const c = e.data;
        if(c === 101 || c === 150) msg('El propietario de este vídeo no permite verlo aquí. Prueba con otra versión.');
        else if(c === 153) msg('YouTube no deja reproducir el vídeo porque la página no se abre desde una dirección web (https).');
        else msg('No se puede reproducir este vídeo (error '+c+').');
      } } };
    if(/^https?:$/.test(location.protocol)) opts.playerVars.origin = location.origin;
    o.player = new YT.Player('rvbox', opts);
  }, () => msg('No he podido cargar YouTube. ¿Hay conexión a internet?'));
  o.destroy = () => { o.dead = true; try{ if(o.player && o.player.destroy) o.player.destroy(); }catch(e){} busy.yt = false; };
  return o;
}

/* ============================== PRACTICAR: progresiones ============================== */
const MAJ_OFF = {1:0, 2:2, 3:4, 4:5, 5:7, 6:9, 7:11};
const MIN_OFF = {1:0, 2:2, 3:3, 4:5, 5:7, 6:8, 7:10};
const ROMAN = { i:1, ii:2, iii:3, iv:4, v:5, vi:6, vii:7 };
const FLATKEYS = { major:new Set([5,10,3,8,1,6]), minor:new Set([2,7,0,5,10,3]) };
const PROGS = {
  major:{ 2:['I–V','I–IV','I–vi'], 3:['I–IV–V','I–V–IV','vi–IV–V'],
          4:['I–V–vi–IV','vi–IV–I–V','I–vi–IV–V','I–IV–vi–V','I–IV–V–IV'],
          5:['I–IV–V–IV–I','I–V–vi–iii–IV','I–vi–IV–V–I','I–IV–I–V–I'] },
  minor:{ 2:['i–VII','i–iv','i–VI','i–v'], 3:['i–iv–v','i–VI–VII','i–VII–VI'],
          4:['i–VII–VI–V','i–VI–III–VII','i–iv–v–i','i–VII–VI–VII'],
          5:['i–iv–v–iv–i','i–VII–VI–VII–i','i–VI–III–VII–i'] }
};
const PROG_NOTES = {
  'I–V–vi–IV':'La progresión del pop: la usan miles de canciones.',
  'vi–IV–I–V':'Parecida a la del pop, pero empezando en el acorde menor.',
  'I–vi–IV–V':'La progresión de los años 50.',
  'I–IV–V':'Es la base del folk, el rock y el blues.',
  'I–IV–V–IV–I':'Esquema de blues sencillo.',
  'i–VII–VI–V':'Cadencia andaluza: suena a flamenco.',
  'i–VI–III–VII':'Muy usada en pop y rock en tono menor.',
  'i–iv–v':'La base de una canción en tono menor.',
  'I–V–vi–iii–IV':'Parecida al canon de Pachelbel.'
};
const KEYLBL = ['C (Do)','C♯ / D♭','D (Re)','E♭','E (Mi)','F (Fa)','F♯ / G♭','G (Sol)','A♭','A (La)','B♭','B (Si)'];
const pg = { count:4, root:0, mode:'major', prog:'I–V–vi–IV', bpm:70, bars:1, rhythm:'b-pop', sound:true, click:true };
function degreeChord(tok, root, mode){
  const lower = tok === tok.toLowerCase();
  const off = (mode === 'major' ? MAJ_OFF : MIN_OFF)[ROMAN[tok.toLowerCase()]];
  const names = FLATKEYS[mode].has(root) ? FLATS : SHARPS;
  return names[(root + off) % 12] + (lower ? 'm' : '');
}
const progFor = (root, mode, prog) => prog.split('–').map(tk => degreeChord(tk, root, mode));
const progChords = () => progFor(pg.root, pg.mode, pg.prog);
const progKey = () => (pg.mode === 'major' ? 'M:' : 'm:') + pg.prog;

function renderProg(box){
  const list = PROGS[pg.mode][pg.count];
  if(!list.includes(pg.prog)) pg.prog = list[0];
  const chords = progChords();
  let R = pg.rhythm === 'none' ? null : getRhythm(pg.rhythm);
  if(pg.rhythm !== 'none' && !R) pg.rhythm = 'none';
  const seq = h('div', {class:'seq'}, chords.map(c => h('span', {text:c})));
  const stage = h('div', {class:'stage'}, ...stageNodes(chords[0], chords[1]));
  const pat = R ? patternView(R.steps, null, false, R) : null;
  const lapsEl = h('div', {class:'muted small', style:'text-align:center', text:''});
  const reset = fn => () => { stopEngine(); fn(); render(); };
  const sel = (label, opts, cur, onChange) => h('select', {'aria-label':label, onchange:ev => { stopEngine(); onChange(ev.target.value); render(); }},
    opts.map(([v,l]) => h('option', {value:v, selected:String(v) === String(cur)}, l)));
  const hasBarre = chords.some(c => { const i = chordInfo(c); return i && i.v.barre; });
  const best = db.progs[progKey()];
  const bpmLbl = h('b', {text:pg.bpm+' BPM'});
  const bpm = h('input', {type:'range', min:'40', max:'140', step:'2', value:String(pg.bpm), 'aria-label':'Tempo'});
  bpm.addEventListener('input', () => { pg.bpm = +bpm.value; bpmLbl.textContent = pg.bpm+' BPM'; if(eng) eng.stepper.setBpm(pg.bpm); });
  const startBtn = h('button', {class:'primary'}, '▶ Empezar');
  startBtn.addEventListener('click', () => { eng ? stopEngine() : startProg(); });

  function startProg(){
    const spb = R ? R.steps.length : 8;
    let laps = 0, last = -1;
    const st = createStepper(pg.bpm, (i, when) => {
      const pos = i % spb, bar = Math.floor(i / spb), ci = Math.floor(bar / pg.bars) % chords.length;
      if(pg.click && pos % rEvery(R) === 0) click(when, pos === 0);
      if(R && pg.sound){ const tk = R.steps[pos]; if(tk !== '-') strumAt(chords[ci], tk, when, R.acc && R.acc.includes(pos)); }
      later(when, () => {
        if(!eng || eng.kind !== 'prog') return;
        if(ci !== last){
          if(ci === 0 && last === chords.length - 1){ laps++; lapsEl.textContent = 'Vueltas completas: '+laps; }
          last = ci;
          [...seq.children].forEach((s2,k) => s2.classList.toggle('on', k === ci));
          stage.replaceChildren(...stageNodes(chords[ci], chords[(ci+1) % chords.length]));
        }
        setPat(pat, pos);
      });
    }, rSub(R));
    busy.prog = true;
    eng = { kind:'prog', stepper:st, onStop:() => {
      startBtn.textContent = '▶ Empezar';
      [...seq.children].forEach(s2 => s2.classList.remove('on')); setPat(pat, -1);
      if(laps > 0){
        const p = db.progs[progKey()] || (db.progs[progKey()] = { laps:0, maxBpm:0 });
        p.laps += laps; if(laps >= 3) p.maxBpm = Math.max(p.maxBpm || 0, pg.bpm);
        save();
      }
    } };
    startBtn.textContent = '■ Parar'; lapsEl.textContent = '';
    st.start();
  }

  add(box,
    h('div', {class:'card'},
      h('p', {class:'muted', style:'margin-top:0', text:'Practica combinaciones de 2 a 5 acordes de las más habituales. Elige la tonalidad, una progresión y un ritmo, y cambia de acorde con el metrónomo.'}),
      h('div', {class:'tabs'}, [2,3,4,5].map(n => h('button', {class:pg.count === n ? 'on' : '', onclick:reset(() => { pg.count = n; })}, n+' acordes'))),
      h('div', {class:'row'},
        sel('Tonalidad', KEYLBL.map((l,i) => [i,l]), pg.root, v => { pg.root = +v; }),
        sel('Modo', [['major','Mayor'],['minor','Menor']], pg.mode, v => { pg.mode = v; })),
      h('div', {class:'row', style:'margin-top:8px'},
        sel('Progresión', list.map(p => [p,p]), pg.prog, v => { pg.prog = v; }),
        sel('Compases por acorde', [[1,'1 compás por acorde'],[2,'2 compases por acorde']], pg.bars, v => { pg.bars = +v; })),
      PROG_NOTES[pg.prog] ? h('div', {class:'muted small', style:'margin-top:8px', text:PROG_NOTES[pg.prog]}) : null,
      hasBarre ? h('div', {class:'note', text:'Esta tonalidad incluye acordes de cejilla, que son más difíciles. Prueba con Do, Sol o La mayor, o con La menor, para empezar.'}) : null),
    h('div', {class:'card'},
      h('div', {class:'row'},
        sel('Ritmo', [['none','Solo metrónomo'], ...allRhythms().map(r => [r.id, rTitle(r)])], pg.rhythm, v => { pg.rhythm = v; }),
        bpm, bpmLbl),
      h('div', {class:'row', style:'margin-top:8px'}, toggleBtn('🎸 Sonido de guitarra', () => pg.sound, v => { pg.sound = v; }), toggleBtn('⏱ Metrónomo', () => pg.click, v => { pg.click = v; })),
      seq, stage, pat, lapsEl,
      h('div', {class:'row', style:'justify-content:center;margin-top:8px'}, startBtn),
      best ? h('div', {class:'muted small', style:'text-align:center;margin-top:8px', text:'Esta progresión: '+best.laps+' vueltas'+(best.maxBpm ? ' · tempo máx. '+best.maxBpm+' BPM' : '')}) : null)
  );
}

let ytWaiting = [];
/* audio propio (se guarda en este dispositivo, en IndexedDB) */
const idb = {
  open(){ return new Promise((ok, ko) => { const r = indexedDB.open('guitarra-audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('a'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  async put(k, v){ const d = await idb.open(); return new Promise((ok, ko) => { const t = d.transaction('a', 'readwrite'); t.objectStore('a').put(v, k); t.oncomplete = ok; t.onerror = () => ko(t.error); }); },
  async get(k){ const d = await idb.open(); return new Promise((ok, ko) => { const r = d.transaction('a').objectStore('a').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  async del(k){ const d = await idb.open(); return new Promise((ok) => { const t = d.transaction('a', 'readwrite'); t.objectStore('a').delete(k); t.oncomplete = ok; t.onerror = ok; }); }
};
function filePlayer(blob, ev){
  const a = new Audio(); a.preload = 'auto'; const url = URL.createObjectURL(blob); a.src = url;
  try{ a.preservesPitch = true; a.mozPreservesPitch = true; a.webkitPreservesPitch = true; }catch(e){}
  a.addEventListener('loadedmetadata', () => ev.onReady && ev.onReady());
  a.addEventListener('play', () => ev.onState && ev.onState(1));
  a.addEventListener('pause', () => ev.onState && ev.onState(2));
  a.addEventListener('ended', () => ev.onState && ev.onState(0));
  a.addEventListener('error', () => ev.onError && ev.onError());
  return {
    getCurrentTime: () => a.currentTime, getDuration: () => a.duration || 0,
    seekTo: t => { a.currentTime = t; }, playVideo: () => a.play(), pauseVideo: () => a.pause(),
    getPlayerState: () => a.paused ? 2 : 1, setPlaybackRate: r => { a.playbackRate = r; },
    destroy: () => { try{ a.pause(); }catch(e){} URL.revokeObjectURL(url); a.removeAttribute('src'); }
  };
}
function loadYT(cb, fail){
  if(window.YT && window.YT.Player){ cb(); return; }
  ytWaiting.push(cb);
  if(document.getElementById('yt-api')) return;
  window.onYouTubeIframeAPIReady = () => { ytWaiting.splice(0).forEach(f => f()); };
  const sc = document.createElement('script');
  sc.id = 'yt-api'; sc.src = 'https://www.youtube.com/iframe_api';
  sc.onerror = () => { sc.remove(); ytWaiting = []; fail(); };
  document.head.append(sc);
}

  if(hasAudio){
    P.audioSrc = true;
    idb.get(song.id).then(blob => {
      if(play !== P) return;
      if(!blob){ toast('No encuentro el audio en este dispositivo. Vuelve a elegirlo.'); return; }
      P.player = filePlayer(blob, {
        onReady: () => { P.ready = true; markBtn.disabled = false; try{ P.player.setPlaybackRate(P.rate); }catch(e){} },
        onState: st => { P.playing = st === 1; busy.yt = P.playing; if(st === 1){ try{ P.player.setPlaybackRate(P.rate); }catch(e){} } },
        onError: () => toast('No se puede reproducir este archivo de audio')
      });
    }).catch(() => toast('No he podido leer el audio guardado'));
  } else if(vid){
    loadYT(()=>{
      if(play !== P) return;
      const opts = { videoId:vid, playerVars:{ playsinline:1, rel:0 }, events:{
        onReady: () => { P.ready = true; markBtn.disabled = false; },
        onStateChange: e => { P.playing = e.data === 1; busy.yt = P.playing; if(e.data === 1){ try{ P.player.setPlaybackRate(P.rate); }catch(err){} } },
        onError: e => {
          const c = e.data;
          if(c === 101 || c === 150) vidMsg('El propietario de este vídeo no permite verlo aquí. Prueba con otra versión de la canción.');
          else if(c === 153) vidMsg('YouTube no deja reproducir el vídeo porque la página no se abre desde una dirección web (https). Publícala en GitHub Pages o ábrela con un servidor local.');
          else vidMsg('No se puede reproducir este vídeo (error '+c+').');
        } } };
      if(/^https?:$/.test(location.protocol)) opts.playerVars.origin = location.origin;
      P.player = new YT.Player('ytbox', opts);
    }, ()=> vidMsg('No he podido cargar YouTube. ¿Hay conexión a internet?'));
  }
}
document.addEventListener('keydown', e => {
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement && document.activeElement.tagName)) return;
  if(e.code !== 'Space' && e.key !== 'Enter') return;
  if(view === 'canciones' && play && play.syncOn){ e.preventDefault(); if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); play.markChord(); }
});

/* ============================== VISTA: progreso ============================== */
function renderProgreso(root){
  const sec = todaySec(), goal = db.goalMin*60;
  const totalSec = Object.values(db.days).reduce((a,d) => a + d.sec, 0);
  const daysOk = Object.values(db.days).filter(d => d.sec >= 60).length;
  const quizPct = db.quiz.total ? Math.round(db.quiz.correct / db.quiz.total * 100) : null;
  add(root, h('h2', {text:'Progreso'}),
    h('div', {class:'stats'},
      h('div', {class:'stat'}, h('b', {text:'🔥 '+streak()}), 'días seguidos'),
      h('div', {class:'stat'}, h('b', {text:bestStreak()}), 'mejor racha'),
      h('div', {class:'stat'}, h('b', {text:daysOk}), 'días practicados'),
      h('div', {class:'stat'}, h('b', {text:fmtMin(totalSec)}), 'en total')),
    h('div', {class:'card', style:'margin-top:12px'},
      h('div', {class:'row'}, h('b', {text:'Hoy: '+fmtMin(sec)+' de '+db.goalMin+' min'}), h('div', {class:'grow'}),
        h('select', {'aria-label':'Meta diaria', onchange:ev=>{ db.goalMin = +ev.target.value; save(); renderToday(); render(); }}, [5,10,15,20,30,45,60].map(n => h('option', {value:n, selected:n===db.goalMin}, 'Meta: '+n+' min')))),
      (() => {
        const bars = [], lbls = [], today = new Date(); let mx = 1;
        const arr = [];
        for(let i = 13; i >= 0; i--){ const d = new Date(today); d.setDate(d.getDate()-i); const s2 = (db.days[dayKey(d)]||{sec:0}).sec; arr.push({d, s:s2}); mx = Math.max(mx, s2); }
        arr.forEach(({d,s:v}) => { bars.push(h('div', {class:v < 60 ? 'z' : '', style:'height:'+Math.max(2, Math.round(v/Math.max(mx,goal)*100))+'%', title:fmtMin(v)})); lbls.push(h('span', {text:String(d.getDate())})); });
        return [h('div', {class:'bars'}, bars), h('div', {class:'barlbl'}, lbls)];
      })()),
    h('h3', {text:'Acordes dominados'}),
    (() => {
      const names = [...ALL_BASIC]; Object.keys(db.mastered).forEach(k => { if(!names.some(n => chordInfo(n).key === k)) names.push(k); });
      const n = names.filter(x => db.mastered[chordInfo(x).key]).length;
      return h('div', {class:'card'}, h('p', {class:'muted', style:'margin-top:0', text:n+' de '+names.length+'. Márcalos en la pestaña Acordes.'}),
        h('div', {class:'chips'}, names.map(x => h('span', {class:'chip'+(db.mastered[chordInfo(x).key]?' sel':''), style:'cursor:default'}, x))));
    })(),
    h('h3', {text:'Cambios de acorde'}),
    (() => {
      const ks = Object.keys(db.pairs).filter(k => db.pairs[k].maxBpm);
      if(!ks.length) return h('p', {class:'muted', text:'Aún no hay datos. Prueba los ejercicios de Practicar.'});
      return h('div', {class:'card'}, h('table', {}, h('tr', {}, h('th',{text:'Par'}), h('th',{text:'Tempo máx.'})),
        ks.map(k => h('tr', {}, h('td',{text:k.replace('-',' ↔ ')}), h('td',{text:db.pairs[k].maxBpm+' BPM'})))));
    })(),
    h('h3', {text:'Progresiones'}),
    (() => {
      const ks = Object.keys(db.progs);
      if(!ks.length) return h('p', {class:'muted', text:'Aún no has practicado ninguna progresión.'});
      return h('div', {class:'card'}, h('table', {}, h('tr', {}, h('th',{text:'Progresión'}), h('th',{text:'Vueltas'}), h('th',{text:'Tempo máx.'})),
        ks.map(k => h('tr', {}, h('td',{text:k.slice(2)+(k[0] === 'm' ? ' (menor)' : '')}), h('td',{text:db.progs[k].laps || 0}), h('td',{text:db.progs[k].maxBpm ? db.progs[k].maxBpm+' BPM' : '—'})))));
    })(),
    h('h3', {text:'Ritmos'}),
    (() => {
      const rows = allRhythms().map(r => ({ r, s:db.rhythmStats[r.id] })).filter(x => x.s && ((x.s.sec || 0) > 0 || x.s.status === 'dominado'));
      if(!rows.length) return h('p', {class:'muted', text:'Aún no has practicado ningún ritmo.'});
      return h('div', {class:'card'}, h('table', {}, h('tr', {}, h('th',{text:'Ritmo'}), h('th',{text:'Tiempo'}), h('th',{text:'Tempo máx.'})),
        rows.map(({r,s:st}) => h('tr', {}, h('td',{text:(st.status === 'dominado' ? '⭐ ' : '')+r.name}), h('td',{text:fmtMin(st.sec || 0)}), h('td',{text:st.maxBpm ? st.maxBpm+' BPM' : '—'})))));
    })(),
    h('h3', {text:'Test de acordes'}),
    (() => {
      if(!db.quiz.total) return h('p', {class:'muted', text:'Aún no has hecho el test.'});
      const worst = Object.entries(db.quiz.miss).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]).slice(0,5);
      return h('div', {class:'card'}, h('div', {text:quizPct+' % de aciertos ('+db.quiz.correct+' de '+db.quiz.total+')'}),
        worst.length ? h('div', {class:'muted small', style:'margin-top:6px', text:'Los que más cuestan: '+worst.map(([k]) => k).join(', ')}) : null);
    })(),
    h('h3', {text:'Canciones'}),
    (() => {
      const rows = db.songs.map(sg => ({ sg, st:db.songStats[sg.id] })).filter(x => x.st && x.st.sec > 0);
      if(!rows.length) return h('p', {class:'muted', text:'Aún no has practicado ninguna canción.'});
      return h('div', {class:'card'}, h('table', {}, h('tr', {}, h('th',{text:'Canción'}), h('th',{text:'Tiempo'}), h('th',{text:'Por velocidad'})),
        rows.map(({sg,st}) => h('tr', {}, h('td',{text:(st.status==='dominada'?'⭐ ':'')+sg.title}), h('td',{text:fmtMin(st.sec)}),
          h('td',{class:'small', text:Object.keys(st.rateSec).sort((a,b)=>a-b).map(r => (r==='1'?'normal':'×'+r.replace('.',','))+': '+fmtMin(st.rateSec[r])).join(' · ')})))));
    })(),
    h('h3', {text:'Copia de seguridad'}),
    h('div', {class:'card'},
      h('p', {class:'muted small', style:'margin-top:0', text:'Tus canciones y tu progreso se guardan solo en este navegador. Exporta una copia para llevarla a otro dispositivo o por si borras los datos del navegador.'}),
      h('div', {class:'row'},
        h('button', {onclick:exportData}, '⬇ Exportar'),
        h('button', {onclick:()=>$('#impfile').click()}, '⬆ Importar'),
        h('input', {type:'file', id:'impfile', accept:'application/json,.json', style:'display:none', onchange:importData}),
        h('div', {class:'grow'}),
        h('button', {class:'danger', onclick:()=>{ if(confirm('Esto borra todo: canciones, marcas y progreso. ¿Seguro?')){ db = defaultDb(); db.seeded = true; flush(); render(); renderToday(); } }}, 'Borrar todo'))));
}
function exportData(){
  flush();
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = h('a', {href:URL.createObjectURL(blob), download:'mi-guitarra-copia-'+dayKey()+'.json'});
  document.body.append(a); a.click(); a.remove();
}
function importData(ev){
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const o = JSON.parse(rd.result);
      if(!o || !Array.isArray(o.songs)) throw new Error('formato');
      if(!confirm('Esto reemplaza lo que hay ahora en este dispositivo por la copia ('+o.songs.length+' canciones). ¿Continuar?')) return;
      db = Object.assign(defaultDb(), o); db.seeded = true; flush(); render(); renderToday(); toast('Copia importada');
    }catch(e){ toast('Ese archivo no parece una copia válida'); }
  };
  rd.readAsText(f);
}

/* ============================== arranque ============================== */
renderNav(); renderToday(); render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
window.__test = { parseSong, chordInfo, chordLine, transposeName, voicing, ytId, progFor, parseTime, strumAt };
})();
</script>
